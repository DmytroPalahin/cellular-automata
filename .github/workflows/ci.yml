name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['21', '25']
        include:
          - os: windows-latest
            java: '21'
          - os: macos-latest
            java: '21'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Compiles with every lint as an error, runs the test suite headless, builds the jar and
      # the coverage report.
      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # The shipped examples are the first thing a user runs: check them with the real jar.
      - name: Validate the example definitions
        shell: bash
        run: java -Djava.awt.headless=true -jar target/cellula.jar validate examples/*.xml

      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco

      - name: Upload the application
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: cellula
          path: target/cellula.jar
